name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        run: |
          apt-get update && apt-get install -y curl build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Build
        run: $HOME/.cargo/bin/cargo build --release
      - name: Run tests
        run: $HOME/.cargo/bin/cargo test